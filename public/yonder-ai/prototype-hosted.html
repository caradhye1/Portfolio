<!DOCTYPE html>

/* ==========================================================================
   Yonder AI Design System
   Single source of truth for the Yonder AI prototype and its documentation.
   Layers: 1 primitives  2 semantic roles  3 base  4 components  5 app shell
   Rule: component rules reference semantic roles only. Raw values live in :root.
   Contrast: every text pair below was measured (WCAG 2.1); see design-system.html.
   ========================================================================== */

/* 1 + 2. TOKENS ---------------------------------------------------------- */
:root {
  /* Primitive: brand purple */
  --purple-50: #f6f3ff;
  --purple-100: #ede8ff;
  --purple-200: #dcd2fe;
  --purple-300: #c2b0fc;
  --purple-400: #a487f7;
  --purple-500: #8b63f0;
  --purple-600: #7445e0;
  --purple-700: #5f33c4;
  --purple-800: #4b2a99;
  --purple-900: #3a2374;

  /* Primitive: violet-tinted neutrals */
  --neutral-0: #ffffff;
  --neutral-50: #faf9fc;
  --neutral-100: #f3f1f7;
  --neutral-200: #e7e4ee;
  --neutral-300: #d2cedd;
  --neutral-400: #8e88a0;
  --neutral-500: #716b84;
  --neutral-600: #605a73;
  --neutral-700: #454058;
  --neutral-800: #2d293c;
  --neutral-900: #1b1826;

  /* Primitive: reserved impact hues, success, data-viz */
  --red-100: #fee4e2;
  --red-600: #d92d20;
  --red-800: #912018;
  --amber-100: #fef0c7;
  --amber-600: #dc6803;
  --amber-800: #93370d;
  --blue-100: #d1e9ff;
  --blue-600: #1570ef;
  --blue-800: #194185;
  --green-100: #dcfae6;
  --green-600: #079455;
  --green-800: #085d3a;
  --teal-600: #0e9384;
  --pink-600: #dd2590;
  --olive-600: #4f7a21;
  --slate-600: #475467;
  --blush-200: #f6cfd3;
  --orchid-200: #e3c4de;
  --lilac-300: #c4b0ea;

  /* Semantic: text */
  --color-text-primary: var(--neutral-900);
  --color-text-body: var(--neutral-700);
  --color-text-secondary: var(--neutral-600);
  --color-text-tertiary: var(--neutral-500);
  --color-text-disabled: var(--neutral-400);
  --color-text-inverse: var(--neutral-0);
  --color-text-link: var(--purple-600);
  --color-text-link-hover: var(--purple-700);
  --color-text-on-app: var(--neutral-900);
  --color-text-on-app-secondary: var(--neutral-700);

  /* Semantic: surfaces */
  --color-surface-app: linear-gradient(120deg, var(--blush-200) 0%, var(--orchid-200) 45%, var(--lilac-300) 100%);
  --color-surface-raised: var(--neutral-0);
  --color-surface-sunken: var(--neutral-50);
  --color-surface-muted: var(--neutral-100);
  --color-surface-inverse: var(--neutral-900);
  --color-surface-scrim: rgba(27, 24, 38, 0.48);

  /* Semantic: borders */
  --color-border-subtle: var(--neutral-200);
  --color-border-default: var(--neutral-300);
  --color-border-control: var(--neutral-400);
  --color-border-strong: var(--neutral-900);
  --color-border-brand: var(--purple-200);

  /* Semantic: action (purple acts) */
  --color-action: var(--purple-600);
  --color-action-hover: var(--purple-700);
  --color-action-pressed: var(--purple-800);
  --color-action-surface: var(--purple-50);
  --color-action-surface-hover: var(--purple-100);
  --color-action-surface-pressed: var(--purple-200);
  --color-action-on-surface: var(--purple-700);

  /* Semantic: selection (ink selects) */
  --color-selected: var(--neutral-900);
  --color-selected-hover: var(--neutral-800);
  --color-on-selected: var(--neutral-0);

  /* Semantic: focus */
  --color-focus: var(--purple-700);

  /* Semantic: impact. RESERVED. Never used for anything but narrative impact. */
  --color-impact-high: var(--red-600);
  --color-impact-high-surface: var(--red-100);
  --color-impact-high-text: var(--red-800);
  --color-impact-moderate: var(--amber-600);
  --color-impact-moderate-surface: var(--amber-100);
  --color-impact-moderate-text: var(--amber-800);
  --color-impact-low: var(--blue-600);
  --color-impact-low-surface: var(--blue-100);
  --color-impact-low-text: var(--blue-800);

  /* Semantic: feedback */
  --color-success: var(--green-600);
  --color-success-surface: var(--green-100);
  --color-success-text: var(--green-800);

  /* Semantic: data visualisation. Categorical order is fixed. */
  --color-viz-1: var(--teal-600);
  --color-viz-2: var(--pink-600);
  --color-viz-3: var(--olive-600);
  --color-viz-4: var(--slate-600);
  --color-viz-total: var(--purple-600);
  --color-viz-benchmark: var(--neutral-600);
  --color-viz-grid: var(--neutral-200);
  --opacity-viz-area: 0.56;       /* area fill at its top edge */
  --opacity-viz-area-soft: 0.24;  /* overlapping areas behind a line, top edge */
  --opacity-viz-area-floor: 0.04; /* every area fades to this at its base */
  --opacity-viz-dimmed: 0.12;

  /* Typography */
  --font-family: "Heebo", sans-serif;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-size-display: 32px;
  --font-size-h1: 24px;
  --font-size-h2: 18px;
  --font-size-h3: 15px;
  --font-size-body: 14px;
  --font-size-small: 13px;
  --font-size-caption: 12px;
  --line-height-display: 40px;
  --line-height-h1: 32px;
  --line-height-h2: 26px;
  --line-height-h3: 22px;
  --line-height-body: 22px;
  --line-height-small: 20px;
  --line-height-caption: 16px;
  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.05em;

  /* Typography: editorial extension. Long-form pages only (case-study.html), never product UI. */
  --font-size-hero: 56px;
  --line-height-hero: 1.14;
  --font-size-prose: 16px;
  --line-height-prose: 28px;

  /* Spacing: 4px base */
  --space-0: 0px;
  --space-1: 2px;
  --space-2: 4px;
  --space-3: 8px;
  --space-4: 12px;
  --space-5: 16px;
  --space-6: 20px;
  --space-7: 24px;
  --space-8: 32px;
  --space-9: 40px;
  --space-10: 48px;
  --space-11: 64px;

  /* Radius */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-pill: 999px;

  /* Borders */
  --border-width-thin: 1px;
  --border-width-thick: 2px;
  --border-width-accent: 3px;

  /* Elevation: violet-tinted, never gray */
  --shadow-sm: 0 1px 2px rgba(43, 24, 92, 0.06), 0 1px 3px rgba(43, 24, 92, 0.08);
  --shadow-md: 0 2px 4px rgba(43, 24, 92, 0.06), 0 8px 20px rgba(43, 24, 92, 0.1);
  --shadow-lg: 0 8px 16px rgba(43, 24, 92, 0.08), 0 24px 48px rgba(43, 24, 92, 0.16);
  --shadow-action: 0 2px 8px rgba(116, 69, 224, 0.32);

  /* Motion */
  --duration-fast: 120ms;
  --duration-base: 180ms;
  --duration-slow: 260ms;
  --duration-spin: 700ms;
  --duration-pulse: 1400ms;
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --easing-exit: cubic-bezier(0.4, 0, 1, 1);
  --lift: translateY(-1px);
  --press: scale(0.98);

  /* Sizing */
  --size-icon-sm: 16px;
  --size-icon-md: 20px;
  --size-icon-lg: 24px;
  --size-control-sm: 32px;
  --size-control-md: 40px;
  --size-control-lg: 48px;
  --size-mark: 20px;
  --size-avatar: 40px;
  --size-avatar-lg: 56px;
  --size-meter: 6px;
  --size-scale: 10px;
  --size-topbar: 56px;
  --size-sidenav: 88px;
  --size-panel: 360px;
  --size-popover: 320px;
  --size-content: 760px;
  --size-content-wide: 1120px;
  --size-modal: 1160px;
  --size-aside: 240px;
  --size-viewport-min: 1280px;
  --size-textarea-min: 72px;
  --size-tooltip-max: 240px;
  --size-chart: 320px;
  --size-thumb: 96px;
  --size-label-col: 96px;
  --size-page: 1200px;
  --size-prose: 640px;

  /* Layering */
  --layer-sticky: 10;
  --layer-popover: 30;
  --layer-panel: 40;
  --layer-modal: 50;
  --layer-toast: 60;
}

/* 3. BASE ---------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: var(--space-0);
  font-family: var(--font-family);
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  font-weight: var(--font-weight-regular);
  color: var(--color-text-body);
  background: var(--neutral-0);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, p, ul, ol, dl, dd, blockquote, figure { margin: var(--space-0); padding: var(--space-0); }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { display: block; }
[hidden] { display: none !important; }

:focus-visible {
  outline: var(--border-width-thick) solid var(--color-focus);
  outline-offset: var(--space-1);
}

.visually-hidden {
  position: absolute;
  width: var(--border-width-thin);
  height: var(--border-width-thin);
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Type roles: one class per role, never mixed ad hoc */
.text-display { font-size: var(--font-size-display); line-height: var(--line-height-display); font-weight: var(--font-weight-bold); letter-spacing: var(--letter-spacing-tight); color: var(--color-text-primary); }
.text-h1 { font-size: var(--font-size-h1); line-height: var(--line-height-h1); font-weight: var(--font-weight-bold); letter-spacing: var(--letter-spacing-tight); color: var(--color-text-primary); }
.text-h2 { font-size: var(--font-size-h2); line-height: var(--line-height-h2); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
.text-h3 { font-size: var(--font-size-h3); line-height: var(--line-height-h3); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
.text-body { font-size: var(--font-size-body); line-height: var(--line-height-body); color: var(--color-text-body); }
.text-small { font-size: var(--font-size-small); line-height: var(--line-height-small); color: var(--color-text-secondary); }
.text-caption { font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: var(--font-weight-medium); color: var(--color-text-tertiary); }
.text-overline { font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: var(--font-weight-semibold); letter-spacing: var(--letter-spacing-wide); text-transform: uppercase; color: var(--color-text-secondary); }

.text-lead { font-size: var(--font-size-h2); line-height: var(--line-height-h2); font-weight: var(--font-weight-regular); color: var(--color-text-body); }
.text-hero { font-size: clamp(var(--font-size-display), 6vw, var(--font-size-hero)); line-height: var(--line-height-hero); font-weight: var(--font-weight-bold); letter-spacing: var(--letter-spacing-tight); color: var(--color-text-primary); }
.text-prose { font-size: var(--font-size-prose); line-height: var(--line-height-prose); color: var(--color-text-body); }
.impact-text--high { color: var(--color-impact-high-text); }
.impact-text--moderate { color: var(--color-impact-moderate-text); }
.impact-text--low { color: var(--color-impact-low-text); }

/* Layout helpers */
.stack { display: flex; flex-direction: column; gap: var(--space-5); }
.stack--tight { gap: var(--space-3); }
.stack--loose { gap: var(--space-7); }
.stack--center { align-items: center; }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.cluster--between { justify-content: space-between; }
.cluster--nowrap { flex-wrap: nowrap; }
.divider { border: var(--space-0); border-top: var(--border-width-thin) solid var(--color-border-subtle); margin: var(--space-0); }

/* 4. COMPONENTS ---------------------------------------------------------- */

/* Icon */
.icon { width: var(--size-icon-md); height: var(--size-icon-md); flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon--sm { width: var(--size-icon-sm); height: var(--size-icon-sm); }
.icon--lg { width: var(--size-icon-lg); height: var(--size-icon-lg); }
.icon--solid { fill: currentColor; }

/* Link */
.link { color: var(--color-text-link); font-weight: var(--font-weight-medium); text-decoration: underline; text-decoration-color: var(--color-border-brand); text-underline-offset: var(--space-1); border-radius: var(--radius-xs); cursor: pointer; background: none; border: var(--space-0); padding: var(--space-0); transition: color var(--duration-fast) var(--easing-standard), text-decoration-color var(--duration-fast) var(--easing-standard); }
.link:hover { color: var(--color-text-link-hover); text-decoration-color: currentColor; }
.link:active { color: var(--color-action-pressed); }
.link[aria-disabled="true"], .link:disabled { color: var(--color-text-disabled); text-decoration: none; cursor: not-allowed; }

/* Button */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-3);
  min-height: var(--size-control-md); padding: var(--space-0) var(--space-5);
  border: var(--border-width-thin) solid transparent; border-radius: var(--radius-md);
  font-size: var(--font-size-body); line-height: var(--line-height-body); font-weight: var(--font-weight-semibold);
  white-space: nowrap; cursor: pointer; text-decoration: none;
  transition: background-color var(--duration-base) var(--easing-standard), border-color var(--duration-base) var(--easing-standard), color var(--duration-base) var(--easing-standard), box-shadow var(--duration-base) var(--easing-standard), transform var(--duration-fast) var(--easing-standard);
}
.btn:active:not(:disabled) { transform: var(--press); }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--color-surface-muted); border-color: transparent; color: var(--color-text-disabled); box-shadow: none; cursor: not-allowed; }

.btn--primary { background: var(--color-action); color: var(--color-text-inverse); box-shadow: var(--shadow-action); }
.btn--primary:hover:not(:disabled) { background: var(--color-action-hover); }
.btn--primary:active:not(:disabled) { background: var(--color-action-pressed); box-shadow: none; }

.btn--secondary { background: var(--color-surface-raised); color: var(--color-text-primary); border-color: var(--color-border-control); }
.btn--secondary:hover:not(:disabled) { background: var(--color-surface-muted); border-color: var(--color-border-strong); }
.btn--secondary:active:not(:disabled) { background: var(--neutral-200); }

.btn--tonal { background: var(--color-action-surface-hover); color: var(--color-action-on-surface); }
.btn--tonal:hover:not(:disabled) { background: var(--color-action-surface-pressed); }
.btn--tonal:active:not(:disabled) { background: var(--purple-300); }

.btn--ghost { background: transparent; color: var(--color-action-on-surface); }
.btn--ghost:hover:not(:disabled) { background: var(--color-action-surface-hover); }
.btn--ghost:active:not(:disabled) { background: var(--color-action-surface-pressed); }
.btn--ghost:disabled { background: transparent; }

/* Destructive is ink, not red: red belongs to High impact. */
.btn--destructive { background: var(--color-surface-raised); color: var(--color-text-primary); border-color: var(--color-border-strong); }
.btn--destructive:hover:not(:disabled) { background: var(--color-surface-inverse); color: var(--color-text-inverse); }
.btn--destructive:active:not(:disabled) { background: var(--neutral-800); color: var(--color-text-inverse); }

/* Success is a resting confirmation state, so it keeps its colour while inert. */
.btn--success, .btn--success:disabled { background: var(--color-success-surface); color: var(--color-success-text); border-color: var(--color-success); cursor: default; }

.btn--sm { min-height: var(--size-control-sm); padding: var(--space-0) var(--space-4); font-size: var(--font-size-small); line-height: var(--line-height-small); border-radius: var(--radius-sm); }
.btn--lg { min-height: var(--size-control-lg); padding: var(--space-0) var(--space-7); }
.btn--block { width: 100%; }

.btn[aria-busy="true"] { cursor: progress; }
.spinner { width: var(--size-icon-sm); height: var(--size-icon-sm); border: var(--border-width-thick) solid currentColor; border-right-color: transparent; border-radius: var(--radius-pill); animation: spin var(--duration-spin) linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Icon button */
.icon-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: var(--size-control-md); height: var(--size-control-md); flex-shrink: 0;
  border: var(--border-width-thin) solid transparent; border-radius: var(--radius-pill);
  background: transparent; color: var(--color-text-secondary); cursor: pointer;
  transition: background-color var(--duration-base) var(--easing-standard), color var(--duration-base) var(--easing-standard), border-color var(--duration-base) var(--easing-standard), transform var(--duration-fast) var(--easing-standard);
}
.icon-btn:hover:not(:disabled) { background: var(--color-surface-muted); color: var(--color-text-primary); }
.icon-btn:active:not(:disabled) { background: var(--neutral-200); transform: var(--press); }
.icon-btn:disabled { color: var(--color-text-disabled); cursor: not-allowed; }
.icon-btn--raised { background: var(--color-surface-raised); color: var(--color-action-on-surface); box-shadow: var(--shadow-sm); }
.icon-btn--raised:hover:not(:disabled) { background: var(--color-action-surface); color: var(--color-action-on-surface); box-shadow: var(--shadow-md); }
.icon-btn--raised:active:not(:disabled) { background: var(--color-action-surface-hover); }
.icon-btn--raised:disabled { background: var(--color-surface-muted); box-shadow: none; }
.icon-btn--sm { width: var(--size-control-sm); height: var(--size-control-sm); }
.icon-btn[aria-pressed="true"] { color: var(--color-action); background: var(--color-action-surface-hover); }
.icon-btn[aria-pressed="true"] .icon { fill: currentColor; }
.icon-btn[aria-expanded="true"] { background: var(--color-selected); color: var(--color-on-selected); }
.icon-btn__count {
  position: absolute; top: calc(var(--space-2) * -1); right: calc(var(--space-2) * -1);
  min-width: var(--size-mark); height: var(--size-mark); padding: var(--space-0) var(--space-2);
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-pill); background: var(--color-selected); color: var(--color-on-selected);
  font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: var(--font-weight-bold);
  border: var(--border-width-thick) solid var(--color-surface-raised);
}

/* Form field */
.field { display: flex; flex-direction: column; gap: var(--space-2); }
.field__label { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-small); line-height: var(--line-height-small); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
.field__hint { font-size: var(--font-size-caption); line-height: var(--line-height-caption); color: var(--color-text-tertiary); }
.field__error { display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
.field__row { display: flex; align-items: center; gap: var(--space-4); }

.input, .textarea, .select {
  width: 100%; min-height: var(--size-control-md); padding: var(--space-3) var(--space-4);
  border: var(--border-width-thin) solid var(--color-border-control); border-radius: var(--radius-md);
  background: var(--color-surface-raised); color: var(--color-text-primary);
  font-size: var(--font-size-body); line-height: var(--line-height-body);
  transition: border-color var(--duration-base) var(--easing-standard), box-shadow var(--duration-base) var(--easing-standard), background-color var(--duration-base) var(--easing-standard);
}
.input::placeholder, .textarea::placeholder { color: var(--color-text-tertiary); opacity: 1; }
.input:hover:not(:disabled), .textarea:hover:not(:disabled), .select:hover:not(:disabled) { border-color: var(--color-border-strong); }
.input:focus-visible, .textarea:focus-visible, .select:focus-visible { outline: var(--border-width-thick) solid var(--color-focus); outline-offset: var(--space-0); border-color: var(--color-focus); }
.input:disabled, .textarea:disabled, .select:disabled { background: var(--color-surface-muted); border-color: var(--color-border-default); color: var(--color-text-disabled); cursor: not-allowed; }
.input[readonly] { background: var(--color-surface-sunken); border-style: dashed; }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--color-border-strong); border-width: var(--border-width-thick); }
.textarea { min-height: var(--size-textarea-min); resize: vertical; }
.select { appearance: none; padding-right: var(--space-8); cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--neutral-600) 50%), linear-gradient(135deg, var(--neutral-600) 50%, transparent 50%); background-position: calc(100% - var(--space-5)) 50%, calc(100% - var(--space-4)) 50%; background-size: var(--space-2) var(--space-2); background-repeat: no-repeat; }
.select--auto, .input--auto { width: auto; }
.input--sm, .select--sm { min-height: var(--size-control-sm); padding-top: var(--space-2); padding-bottom: var(--space-2); font-size: var(--font-size-small); line-height: var(--line-height-small); }

/* Checkbox */

.query { margin: var(--space-0); padding: var(--space-5); border: var(--border-width-thin) solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--color-surface-sunken); display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
.query__grid { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--space-4) var(--space-5); align-items: center; }
.query__grid .cluster--nowrap .tag-input { flex: 1; }
.query__label { text-align: right; }
.query__platforms { width: var(--size-popover); }
.query-or { text-align: center; }

.steps { display: flex; align-items: center; gap: var(--space-3); }
.steps__dot { width: var(--space-7); height: var(--space-2); border-radius: var(--radius-pill); background: var(--color-border-default); }
.steps__dot.is-done { background: var(--color-selected); }
.summary-list { display: grid; grid-template-columns: auto 1fr; gap: var(--space-3) var(--space-5); }
.summary-list dd { color: var(--color-text-primary); font-weight: var(--font-weight-semibold); }
.alerts-card { padding: var(--space-3) var(--space-5) var(--space-5); }
.alerts-card .table td { padding-top: var(--space-5); padding-bottom: var(--space-5); vertical-align: top; }
.alerts-card .table__title { width: 28%; }
.alerts-card .table__date { white-space: nowrap; }
.alerts-card .table td.table__actions { padding-top: var(--space-3); }
.alerts-card .text-caption { color: var(--color-text-tertiary); }
.alerts-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); padding: var(--space-5) var(--space-4) var(--space-0); border-top: var(--border-width-thin) solid var(--color-border-subtle); }
.row-menu { position: relative; display: inline-flex; }
.row-menu .popover { top: calc(100% + var(--space-2)); right: 0; }
.alert-detail { display: grid; grid-template-columns: minmax(0, 1fr) var(--size-popover); gap: var(--space-6); align-items: start; }
.alert-detail__thread { display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-8) var(--space-9); }
.alert-detail__aside { display: flex; flex-direction: column; gap: var(--space-5); }
.faction-list { display: flex; flex-direction: column; gap: var(--space-2); }
.faction-list span.text-small { color: var(--color-text-primary); }
.add-anchor { position: relative; }
.add-anchor .popover { left: 0; bottom: calc(100% + var(--space-3)); transform-origin: bottom left; }
</style>
</head>

<script>
/* ========================================================================
   Yonder AI prototype. Sample data is illustrative; copy marked [COPY TBD]
   was not legible in the source screens and is flagged for the author.
   ======================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n, c = '') => `<svg class="icon ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const IMPACT = {
  high: { label: 'High impact', short: 'High', level: 3, letter: 'H' },
  moderate: { label: 'Moderate impact', short: 'Moderate', level: 2, letter: 'M' },
  low: { label: 'Low impact', short: 'Low', level: 1, letter: 'L' },
};
const TRAJECTORY = {
  rising: { label: 'Rising', icon: 'trend-up' },
  steady: { label: 'Steady', icon: 'steady' },
  falling: { label: 'Falling', icon: 'trend-down' },
};
const NARRATIVES = {
  tigray: { title: 'McDonalds, TigrayGenocide', impact: 'high', trajectory: 'falling', flagged: true, factions: ['QAnon', 'Fringe Trolls', 'Antifa'], inauth: 0.21,
    post: 'We ask @McDonalds to take a stance against the #TigrayGenocide, as well as the massacres happening across the country, incl. in Oromia, Benishangul Gumuz and more. #BoycottEthiopianCoffee – remain committed to your goals in ethical sourcing.' },
  cups: { title: 'McDonalds Using More than 4 Million Plastic Cups', impact: 'moderate', trajectory: 'rising', flagged: true, factions: ['Social Action', 'Populist Left'], inauth: 0.34,
    post: 'Welcome eco-friendlies! Today we have everyone’s favorite unnatural company McDonalds using more than 4 MILLION plastic cups a year! Did you know climate change is a real thing! Find out what else is swept underneath the rug!' },
  pronouns: { title: 'McDonalds Employees Sharing Pronouns on Badge', impact: 'low', trajectory: 'steady', flagged: true, factions: ['Populist Right', 'Twitter Conspirators'], inauth: 0.12,
    post: 'McDonalds wanting staff to show their pronouns on a badge for Pride Month (ENGLAND) So my housemate just told me that to ‘support’ Pride Month McDonalds employees are supposed to be having their pronouns on a separate badge next to their name.' },
  masks: { title: 'McDonalds, masks in Palm Beach', impact: 'high', trajectory: 'rising', flagged: false, factions: ['Populist Right', 'QAnon'], inauth: 0.47, post: '[COPY TBD] Sample post for this narrative.' },
  pay: { title: 'McDonalds Pay Your Employees', impact: 'moderate', trajectory: 'steady', flagged: false, factions: ['Social Action', 'Antifa'], inauth: 0.18, post: '[COPY TBD] Sample post for this narrative.' },
  boycott: { title: 'Boycott McDonalds for supporting GB [COPY TBD]', impact: 'low', trajectory: 'falling', flagged: false, factions: ['Twitch Gamers'], inauth: 0.08, post: '[COPY TBD] Sample post for this narrative.' },
};
const FACTION_IDS = { 'QAnon': 'qanon', 'Fringe Trolls': 'fringe-trolls', 'Antifa': 'antifa', 'Populist Right': 'populist-right', 'Populist Left': 'populist-left', 'Social Action': 'social-action', 'Twitch Gamers': 'twitch-gamers', 'Twitter Conspirators': 'twitter-conspirators' };
const DAYS = [
  { short: 'Apr 22, 2021', long: 'Thursday, April 22, 2021' },
  { short: 'Apr 21, 2021', long: 'Wednesday, April 21, 2021' },
];
const SORTS = { curated: 'Curated order', impact: 'Impact, high to low', inauth: 'Inauthenticity, high to low' };
const NAV = [
  { route: 'digest', label: 'McDonalds', letter: 'M' },
  { route: 'reports', label: 'Reports', icon: 'search' },
  { route: 'convos', label: 'Convos', icon: 'message' },
  { route: 'content', label: 'Content', icon: 'layers' },
  { route: 'alerts', label: 'Alerts', icon: 'bell' },
  { route: 'factions', label: 'Factions', icon: 'users' },
];

const state = {
  title: 'McDonalds Daily Digest',
  order: Object.keys(NARRATIVES),
  removed: [],
  filters: { impact: new Set(), trajectory: new Set(), faction: new Set(), flagged: false },
  sort: 'curated',
  starred: new Set(['tigray']),
  collapsed: new Set(),
  day: 0,
  pop: null,
  curate: { open: false, step: 1 },
};

/* ---------- shared fragments ---------- */
const impactBadge = (k) => `<span class="badge badge--impact-${k}"><span class="level level--${IMPACT[k].level}" aria-hidden="true"><i></i><i></i><i></i></span>${IMPACT[k].label}</span>`;
const impactMark = (k) => `<span class="impact-mark impact-mark--${k}" aria-label="${IMPACT[k].label}">${IMPACT[k].letter}</span>`;
const trajectoryBadge = (k) => `<span class="badge badge--outline">${icon(TRAJECTORY[k].icon)}${TRAJECTORY[k].label}</span>`;
const pct = (v) => Math.round(v * 100) + '%';
const filterCount = () => state.filters.impact.size + state.filters.trajectory.size + state.filters.faction.size + (state.filters.flagged ? 1 : 0);

function visibleNarratives() {
  const f = state.filters;
  const rank = { high: 3, moderate: 2, low: 1 };
  let ids = state.order.filter((id) => {
    const n = NARRATIVES[id];
    return (!f.impact.size || f.impact.has(n.impact)) && (!f.trajectory.size || f.trajectory.has(n.trajectory))
      && (!f.faction.size || n.factions.some((x) => f.faction.has(x))) && (!f.flagged || n.flagged);
  });
  if (state.sort === 'impact') ids = [...ids].sort((a, b) => rank[NARRATIVES[b].impact] - rank[NARRATIVES[a].impact]);
  if (state.sort === 'inauth') ids = [...ids].sort((a, b) => NARRATIVES[b].inauth - NARRATIVES[a].inauth);
  return ids;
}

/* ---------- Screen 1: Daily Digest ---------- */
function narrativeCard(id) {
  const n = NARRATIVES[id];
  const starred = state.starred.has(id), collapsed = state.collapsed.has(id);
  return `
  <li><article class="narrative-card ${n.flagged ? 'is-flagged' : ''} ${collapsed ? 'is-collapsed' : ''}" aria-labelledby="nt-${id}">
    ${n.flagged ? `<span class="badge badge--ink flag-badge">${icon('flag')}Flagged</span>` : ''}
    <div class="narrative-card__header">
      <button class="narrative-card__title" id="nt-${id}" data-action="open-narrative" data-arg="${id}" data-key="title-${id}">${esc(n.title)}</button>
      <div class="narrative-card__actions">
        <button class="icon-btn icon-btn--sm" data-action="open-narrative" data-arg="${id}" data-key="analyze-${id}" aria-label="Analyze narrative" data-tooltip="Analyze">${icon('chart', 'icon--sm')}</button>
        <button class="icon-btn icon-btn--sm" data-action="star" data-arg="${id}" data-key="star-${id}" aria-pressed="${starred}" aria-label="Star narrative" data-tooltip="${starred ? 'Starred' : 'Star'}">${icon('star', 'icon--sm')}</button>
        <button class="icon-btn icon-btn--sm" data-action="collapse" data-arg="${id}" data-key="collapse-${id}" aria-label="${collapsed ? 'Expand' : 'Collapse'} narrative" data-tooltip="${collapsed ? 'Expand' : 'Collapse'}" data-tooltip-side="left">${icon(collapsed ? 'chevron-down' : 'chevron-up', 'icon--sm')}</button>
      </div>
    </div>
    <div class="narrative-card__meta">
      ${impactBadge(n.impact)}${trajectoryBadge(n.trajectory)}
      ${n.factions.map((x) => `<a class="link text-small" href="#/factions/${FACTION_IDS[x]}">${x}</a>`).join('')}
    </div>
    <div class="narrative-card__body">
      <blockquote class="narrative-card__quote">${esc(n.post)}</blockquote>
      <div class="narrative-card__footer">
        <span class="text-caption inauth-label">Inauthenticity</span>
        <span class="meter" role="img" aria-label="Inauthenticity ${pct(n.inauth)}"><span class="meter__fill" style="--meter-value:${n.inauth}"></span></span>
        <span class="text-small inauth-value">${pct(n.inauth)}</span>
      </div>
    </div>
  </article></li>`;
}

function filterPopover() {
  const f = state.filters;
  const chip = (group, value, label, extra = '') => `<button class="chip" data-action="filter" data-arg="${group}:${value}" data-key="f-${group}-${value}" aria-pressed="${f[group].has(value)}">${extra}${label}</button>`;
  const factions = [...new Set(state.order.flatMap((id) => NARRATIVES[id].factions))];
  return `
  <div class="popover stack" role="dialog" aria-label="Filter narratives">
    <div class="filter-group"><h3 class="text-overline">Impact</h3><div class="cluster">
      ${Object.keys(IMPACT).map((k) => chip('impact', k, IMPACT[k].short, `<span class="level level--${IMPACT[k].level}" aria-hidden="true"><i></i><i></i><i></i></span>`)).join('')}</div></div>
    <div class="filter-group"><h3 class="text-overline">Trajectory</h3><div class="cluster">
      ${Object.keys(TRAJECTORY).map((k) => chip('trajectory', k, TRAJECTORY[k].label)).join('')}</div></div>
    <div class="filter-group"><h3 class="text-overline">Factions</h3><div class="cluster">
      ${factions.map((x) => chip('faction', x, x)).join('')}</div></div>
    <label class="checkbox"><input type="checkbox" data-action="filter-flagged" data-key="f-flagged" ${f.flagged ? 'checked' : ''}>Flagged narratives only</label>
    <div class="filter-footer">
      <span class="text-small">${visibleNarratives().length} of ${state.order.length} narratives</span>
      <button class="btn btn--ghost btn--sm" data-action="filter-clear" data-key="f-clear" ${filterCount() ? '' : 'disabled'}>Clear all</button>
    </div>
  </div>`;
}

function sortPopover() {
  return `<div class="popover popover--menu" role="menu" aria-label="Sort narratives">
    ${Object.entries(SORTS).map(([k, label]) => `<button class="menu__item" role="menuitemradio" aria-checked="${state.sort === k}" data-action="sort" data-arg="${k}" data-key="sort-${k}">${label}${icon('check', 'icon--sm')}</button>`).join('')}
  </div>`;
}

function viewDigest() {
  const day = DAYS[state.day];
  const ids = visibleNarratives();
  const count = filterCount();
  const flagged = state.order.filter((id) => NARRATIVES[id].flagged);
  const toolbar = `
  <div class="toolbar">
    <button class="icon-btn icon-btn--raised" data-action="curate-open" data-key="curate" aria-label="Curate digest" data-tooltip="Curate" ${state.day ? 'disabled' : ''}>${icon('pencil')}</button>
    <div class="toolbar__anchor">
      <button class="icon-btn icon-btn--raised" data-action="pop" data-arg="filter" data-key="pop-filter" data-pop aria-label="Filter narratives${count ? `, ${count} active` : ''}" aria-expanded="${state.pop === 'filter'}" ${state.pop ? '' : 'data-tooltip="Filter"'} ${state.day ? 'disabled' : ''}>${icon('filter')}${count ? `<span class="icon-btn__count" aria-hidden="true">${count}</span>` : ''}</button>
      ${state.pop === 'filter' ? filterPopover() : ''}
    </div>
    <div class="toolbar__anchor">
      <button class="icon-btn icon-btn--raised" data-action="pop" data-arg="sort" data-key="pop-sort" data-pop aria-label="Sort narratives" aria-expanded="${state.pop === 'sort'}" ${state.pop ? '' : 'data-tooltip="Sort"'} ${state.day ? 'disabled' : ''}>${icon('sort')}</button>
      ${state.pop === 'sort' ? sortPopover() : ''}
    </div>
    <div class="date-pager">
      <button class="icon-btn icon-btn--sm" data-action="day" data-arg="1" data-key="day-prev" aria-label="Previous day" ${state.day >= DAYS.length - 1 ? 'disabled' : ''}>${icon('chevron-left', 'icon--sm')}</button>
      <span class="date-pager__label">Daily Digest · ${day.short}</span>
      <button class="icon-btn icon-btn--sm" data-action="day" data-arg="-1" data-key="day-next" aria-label="Next day" ${state.day === 0 ? 'disabled' : ''}>${icon('chevron-right', 'icon--sm')}</button>
    </div>
  </div>`;

  if (state.day) {
    return `<div class="app__column">${toolbar}
      <div class="empty-state"><span class="empty-state__icon">${icon('calendar', 'icon--lg')}</span>
        <h1 class="text-h2">No digest for ${day.short}</h1>
        <p class="text-small">Nothing was curated for this day. Go forward to the latest digest.</p>
        <button class="btn btn--secondary" data-action="day" data-arg="-1" data-key="day-latest">Go to ${DAYS[0].short}</button>
      </div></div>`;
  }

  const active = [
    ...[...state.filters.impact].map((k) => ['impact', k, IMPACT[k].label]),
    ...[...state.filters.trajectory].map((k) => ['trajectory', k, TRAJECTORY[k].label]),
    ...[...state.filters.faction].map((k) => ['faction', k, k]),
  ];
  return `<div class="app__column">${toolbar}
    <section class="digest" aria-labelledby="digest-title">
      <span class="avatar avatar--brand" aria-hidden="true">${icon('logo')}</span>
      <div class="digest__title">${icon('calendar', 'icon--lg')}<h1 class="text-display" id="digest-title">${esc(state.title)}</h1></div>

const TABS = [['who', 'Who is involved?'], ['care', 'Should I care?'], ['why', 'Why is this happening?'], ['what', 'What can I do?']];
const AXIS_DATES = ['Apr 27', 'Apr 28', 'Apr 29', 'Apr 30', 'May 01', 'May 02', 'May 03'];
const SERIES = {
  tigray: {
    factions: [
      { name: 'QAnon', values: [8, 10, 14, 12, 26, 10, 12, 9, 15, 9, 11, 9, 8] },

const MEANS = {
  who: 'This graph highlights the ebb and flow of factions active within the narrative, and focuses on faction activity rather than faction volume in order to provide a gauge of who is framing the narrative and influencing the conversation. A wider color band represents a more active faction, whereas a thinner color band represents a less active faction. This can be used to better understand who is involved in the narrative, if the factions active change over time, and whether factions are influencing one another.',

  why: 'Factions are organized and can mobilize to amplify messages effectively. High faction activity is often a precursor to narratives entering the mainstream, and can be an indication that the factions involved are agenda-driven and persistent. Factions often increase amplification of a narrative even as engagement from the mainstream has declined in an attempt to keep the narrative relevant. Use this graph to understand how active factions are in the narrative relative to the general public.',
};
const TIGRAY_COPY = {
  influence: 'QAnon are currently the most influential faction within this narrative, they have low influence. They have a higher influence within this narrative than normal for the faction, they also have a higher reach than typical, suggesting they may be attracting engagement from factions they do not usually overlap with.',
  coordination: 'There are no signals of coordinated activity within this narrative, at this time.',

  origin: 'This narrative first appeared in the Daily Digest from May 20th, and was originated by the Populist Right.',
};
const TBD = '[COPY TBD] Analysis summary for this narrative.';
const analysis = { id: null, tab: 'who', hidden: new Set(), noteOpen: false };
state.notes = {};
state.alerts = new Set();

function seriesFor(id) {
  if (SERIES[id]) return SERIES[id];
  let s = [...id].reduce((a, c) => a + c.charCodeAt(0), 7);
  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const wave = (base, amp) => Array.from({ length: 13 }, (_, i) => Math.round(base + amp * (0.5 + 0.5 * Math.sin(i / 1.7 + r() * 2)) * (0.6 + r() * 0.8)));
  return (SERIES[id] = { factions: NARRATIVES[id].factions.slice(0, 3).map((name, i) => ({ name, values: wave(6 + i * 3, 14 - i * 3) })), posts: wave(400, 900), share: wave(25, 40) });
}

const G = { w: 860, h: 340, l: 56, r: 56, t: 20, b: 60 };
const gx = (i) => G.l + i * (G.w - G.l - G.r) / 12;
const gy = (v, max) => G.t + (1 - v / max) * (G.h - G.t - G.b);
const f1 = (n) => n.toFixed(1);
function smooth(p) {
  let d = `M${f1(p[0][0])},${f1(p[0][1])}`;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
    d += ` C${f1(b[0] + (c[0] - a[0]) / 6)},${f1(b[1] + (c[1] - a[1]) / 6)} ${f1(c[0] - (e[0] - b[0]) / 6)},${f1(c[1] - (e[1] - b[1]) / 6)} ${f1(c[0])},${f1(c[1])}`;
  }
  return d;
}
const band = (top, bottom) => `${smooth(top)} ${smooth([...bottom].reverse()).replace('M', 'L')} Z`;
const pointLabel = (i) => (i % 2 ? `${AXIS_DATES[(i + 1) / 2]}, 12:00 AM` : `${AXIS_DATES[i / 2]}, 12:00 PM`);

// Gradients the .chart__area classes point at: one strong and one soft fade per categorical hue.
const chartDefs = () => `<defs>${[1, 2, 3, 4].map((k) => ['', 'soft-'].map((v) => `<linearGradient id="viz-fade-${v}${k}" class="chart__fade ${v ? 'chart__fade--soft' : ''} viz-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0"/><stop offset="1"/></linearGradient>`).join('')).join('')}</defs>`;
// Hover markers: one dot per series per point, shown for the point under the cursor.
const markers = (cls, pts) => pts.map(([x, y], i) => `<circle class="chart__marker ${cls}" data-i="${i}" cx="${f1(x)}" cy="${f1(y)}" r="4.5"/>`).join('');

function chartFrame({ leftMax, leftFmt, leftTitle, rightFmt, body, label }) {
  const steps = [0, 0.25, 0.5, 0.75, 1];
  return `<div class="chart" tabindex="0" role="img" aria-label="${esc(label)} Use left and right arrow keys to read values.">
    <svg viewBox="0 0 ${G.w} ${G.h}">${chartDefs()}
      ${steps.map((s) => `<line class="chart__grid ${s ? '' : 'chart__grid--base'}" x1="${G.l}" x2="${G.w - G.r}" y1="${gy(s, 1)}" y2="${gy(s, 1)}"/>
        <text class="chart__tick" x="${G.l - 10}" y="${gy(s, 1) + 4}" text-anchor="end">${leftFmt(s * leftMax)}</text>
        ${rightFmt ? `<text class="chart__tick" x="${G.w - G.r + 10}" y="${gy(s, 1) + 4}">${rightFmt(s)}</text>` : ''}`).join('')}
      ${AXIS_DATES.map((d, k) => `<text class="chart__tick" x="${gx(k * 2)}" y="${G.h - G.b + 22}" text-anchor="middle">${d}</text>`).join('')}
      <text class="chart__axis-title" x="${(G.l + G.w - G.r) / 2}" y="${G.h - 8}" text-anchor="middle">Date</text>
      <text class="chart__axis-title" transform="translate(14 ${(G.t + G.h - G.b) / 2}) rotate(-90)" text-anchor="middle">${leftTitle}</text>
      ${body}
      <line class="chart__cursor" y1="${G.t}" y2="${G.h - G.b}" visibility="hidden"/>
      <rect class="chart__hit" x="${G.l}" y="${G.t}" width="${G.w - G.l - G.r}" height="${G.h - G.t - G.b}"/>
    </svg>
    <div class="chart__tip" hidden></div>
  </div>`;
}

function whoChart(s) {
  const max = Math.ceil(Math.max(...s.factions[0].values.map((_, i) => s.factions.reduce((a, f) => a + f.values[i], 0))) / 20) * 20;
  let base = Array(13).fill(0), body = '', edges = '', dots = '';
  s.factions.forEach((f, k) => {
    if (analysis.hidden.has(f.name)) return;
    const top = base.map((b, i) => b + f.values[i]), pts = top.map((v, i) => [gx(i), gy(v, max)]);
    body += `<path class="chart__area viz-${k + 1}" d="${band(pts, base.map((v, i) => [gx(i), gy(v, max)]))}"/>`;
    edges += `<path class="chart__edge viz-${k + 1}" d="${smooth(pts)}"/>`;
    dots += markers(`viz-${k + 1}`, pts);
    base = top;
  });
  body += edges + dots;
  return chartFrame({ leftMax: max, leftFmt: (v) => Math.round(v) + '%', leftTitle: '% engagement', body, label: 'Stacked area chart of faction engagement over 7 days.' });
}

function whyChart(s) {
  const max = Math.ceil(Math.max(...s.posts) / 500) * 500;
  const peak = s.posts.indexOf(Math.max(...s.posts));
  let body = s.factions.map((f, k) => { if (analysis.hidden.has(f.name)) return ''; const pts = f.values.map((v, i) => [gx(i), gy(v, 100)]);
    return `<path class="chart__area chart__area--soft viz-${k + 1}" d="${band(pts, f.values.map((_, i) => [gx(i), gy(0, 100)]))}"/><path class="chart__edge chart__edge--soft viz-${k + 1}" d="${smooth(pts)}"/>`; }).join('');
  const share = s.share.map((v, i) => [gx(i), gy(v, 100)]), posts = s.posts.map((v, i) => [gx(i), gy(v, max)]);
  body += `<path class="chart__line chart__line--dashed viz-benchmark" d="${smooth(share)}"/>
    <path class="chart__line viz-total" d="${smooth(posts)}"/>
    <circle class="chart__dot viz-total" cx="${gx(peak)}" cy="${gy(s.posts[peak], max)}" r="5"/>${markers('viz-benchmark', share)}${markers('viz-total', posts)}`;
  const html = chartFrame({ leftMax: max, leftFmt: (v) => Math.round(v).toLocaleString(), leftTitle: 'Number of posts', rightFmt: (v) => Math.round(v * 100) + '%', body, label: 'Line chart of number of posts and share of faction posts over 7 days.' });
  const note = `<p class="chart__note text-caption" style="left:${gx(peak) / G.w * 100}%;top:${gy(s.posts[peak], max) / G.h * 100}%">${esc(s.note || `Peak: ${s.posts[peak].toLocaleString()} posts`)}</p>`;
  return html.replace('<div class="chart__tip"', note + '<div class="chart__tip"');
}

function tipHTML(i) {
  const s = seriesFor(analysis.id);
  const row = (cls, name, value) => `<div class="chart__tip-row"><span class="chart__tip-key ${cls}"><i></i><span>${name}</span></span><strong>${value}</strong></div>`;
  const factions = s.factions.map((f, k) => (analysis.hidden.has(f.name) ? '' : row(`viz-${k + 1}`, f.name, f.values[i] + '%'))).join('');
  return `<strong>${pointLabel(i)}</strong>` + (analysis.tab === 'why' ? row('viz-total', 'Number of posts', s.posts[i].toLocaleString()) + row('viz-benchmark', '% of faction posts', s.share[i] + '%') : '') + factions;
}

function setChartIndex(i) {
  const c = $('#modal-root .chart'); if (!c) return;
  const cur = $('.chart__cursor', c), tip = $('.chart__tip', c);
  analysis.idx = i;
  $$('.chart__marker', c).forEach((m) => m.classList.toggle('is-on', Number(m.dataset.i) === i));
  if (i == null) { cur.setAttribute('visibility', 'hidden'); tip.hidden = true; return; }
  cur.setAttribute('x1', gx(i)); cur.setAttribute('x2', gx(i)); cur.setAttribute('visibility', 'visible');
  tip.innerHTML = tipHTML(i); tip.hidden = false;
  const b = $('svg', c).getBoundingClientRect(), px = gx(i) / G.w * b.width;
  tip.style.transform = `translate(${i > 7 ? px - tip.offsetWidth - 12 : px + 12}px, ${G.t / G.h * b.height}px)`;
}

function bindChart() {
  const c = $('#modal-root .chart'); if (!c) return;
  const svg = $('svg', c);
  svg.addEventListener('mousemove', (e) => { const b = svg.getBoundingClientRect(); const x = (e.clientX - b.left) / b.width * G.w; setChartIndex(Math.max(0, Math.min(12, Math.round((x - G.l) / ((G.w - G.l - G.r) / 12))))); });
  svg.addEventListener('mouseleave', () => setChartIndex(null));
  c.addEventListener('blur', () => setChartIndex(null));
  c.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    setChartIndex(Math.max(0, Math.min(12, (analysis.idx ?? (e.key === 'ArrowRight' ? -1 : 13)) + (e.key === 'ArrowRight' ? 1 : -1))));
  });
}

const scale = (segs, current, label) => `<div class="scale scale--label-${current + 1}" role="img" aria-label="${label}"><span class="scale__label">${label}</span>
  <span class="scale__track">${segs.map((c, i) => `<span class="scale__seg scale__seg--${c} ${i === current ? 'is-current' : ''}"></span>`).join('')}</span></div>`;
const infoBtn = (text, side = '') => `<button class="info-btn" aria-label="${esc(text)}" data-tooltip="${esc(text)}" ${side ? `data-tooltip-side="${side}"` : ''}>${icon('info', 'icon--sm')}</button>`;
const meansBlock = (k) => `<div class="stack stack--tight"><h3 class="text-h3">What this means</h3><p class="text-small">${MEANS[k]}</p></div>`;
const factionLegend = (s) => s.factions.map((f, k) => `<button class="legend__item viz-${k + 1}" data-action="an-series" data-arg="${f.name}" data-key="series-${k}" aria-pressed="${!analysis.hidden.has(f.name)}" ${!analysis.hidden.has(f.name) && s.factions.length - analysis.hidden.size === 1 ? 'disabled' : ''}><span class="legend__swatch"></span><span class="text-small">${f.name}</span></button>`).join('');

        ${analysis.noteOpen ? `<div class="field"><label class="field__label" for="note-text">Note</label>
            <textarea class="textarea" id="note-text" data-key="note-text" placeholder="What should your team know about this chart?"></textarea>
            <div class="cluster"><button class="btn btn--secondary btn--sm" data-action="an-note-save" data-key="note-save">Save note</button><button class="btn btn--ghost btn--sm" data-action="an-note-cancel" data-key="note-add">Cancel</button></div></div>`
        : `<div><button class="btn btn--tonal btn--sm" data-action="an-note-open" data-key="note-add">${icon('note', 'icon--sm')}Add a note</button></div>`}
      </div>
      <aside class="stack stack--loose"><div class="stack stack--tight"><h3 class="text-h3">Top factions</h3><div class="legend">${factionLegend(s)}</div><p class="text-caption">Select a faction to hide or show it.</p></div>${meansBlock('who')}</aside>`;
  }
  if (analysis.tab === 'care') {
    const lvl = IMPACT[n.impact].level - 1;
    const inauthLvl = n.inauth < 0.25 ? 0 : n.inauth < 0.4 ? 1 : 2;
    const actual = id === 'tigray' ? [17, 2, 2] : [0.8, 0.1, 0.1].map((p) => Math.round(n.inauth * 100 * p));
    const typical = [15, 3, 2], top = Math.max(...actual, ...typical) * 1.15;
    const section = (title, value, text) => `<hr class="divider"><div class="stack stack--tight care__section"><h4 class="text-h3">${title}</h4><p class="care__value">${value}</p><p class="text-small">${text}</p></div>`;
    return `<div class="analysis__main analysis__cards">
        <section class="card card--flat care" aria-labelledby="care-impact">
          <h3 class="text-h2 cluster" id="care-impact">Impact ${infoBtn('How much this narrative could affect the brand, from Low to High.')}</h3>
          ${scale(['low', 'moderate', 'high'], lvl, IMPACT[n.impact].short)}
          ${section('Influence', n.factions[0], copy ? copy.influence : TBD)}
          ${section('Coordination', 'No', copy ? copy.coordination : TBD)}
          ${section('Trajectory', TRAJECTORY[n.trajectory].label, copy ? copy.trajectory : TBD)}
        </section>
        <section class="card card--flat care" aria-labelledby="care-inauth">
          <h3 class="text-h2" id="care-inauth">Inauthenticity</h3>

function commitTag(field) {
  const v = field.value.trim().replace(/,$/, '').trim();
  if (!v) return false;
  const list = listAt(field.dataset.tagField);
  if (!list.includes(v)) list.push(v);
  markDirty(); render(field.dataset.key); return true;
}

  { id: 'shareholder-incident', title: 'Shareholder Meeting and McDonald’s + Fringe Trolls + Incident Reporting', convo: 'Incident Report: McDonald’s May Shareholder Meeting', keyword: 'Shareholder meeting McDonald’s', faction: '', created: '2021-04-16' },
  { id: 'stakeholder', title: 'McDonalds + Stakeholder Meeting', convo: 'McDonalds + Stakeholder Meeting', keyword: 'boycott', faction: '', created: '2021-04-12' },
  { id: 'mcdc-nft', title: 'McDonald’s + MCDC', convo: 'Topic 1: McDonald’s Fringe', keyword: 'MCDC', faction: 'Non-Fungible Token (NFT) Enthusiasts', created: '2021-04-02' },
  { id: 'shareholder', title: 'Shareholder Meeting', convo: 'Topic 1: McDonald’s Fringe', keyword: 'MCDC', faction: 'Cryptocurrency Promoters', created: '2021-03-15' },
  { id: 'fringe', title: 'McDonald’s + Fringe Trolls & Extremists', convo: 'Topic 1: McDonald’s Fringe', keyword: 'MCDC', faction: '', created: '2021-03-15' },
];
state.alerts.add('cups');
state.alertQuery = '';
state.alertPage = 1;
let alertQueryShown = '', undoAlert = null;
const ALERT_PAGE_SIZE = 5;

// Alerts turned on from "What can I do?" join the list as narrative alerts.
const narrativeAlert = (nid) => ({ id: 'n-' + nid, narrative: nid, title: NARRATIVES[nid].title, convo: state.title, keyword: 'Impact or trajectory change', faction: NARRATIVES[nid].factions[0], created: TODAY });
const allAlerts = () => [...[...state.alerts].map(narrativeAlert), ...state.alertList].sort((a, b) => b.created.localeCompare(a.created));
const factionLink = (name) => (FACTION_IDS[name] ? `<a class="link text-small" href="#/factions/${FACTION_IDS[name]}">${esc(name)}</a>` : `<span class="text-small">${esc(name)}</span>`);

function viewAlerts() {
  const q = state.alertQuery.trim().toLowerCase();
  if (state.alertQuery !== alertQueryShown) { state.alertPage = 1; alertQueryShown = state.alertQuery; }
  const rows = allAlerts().filter((a) => !q || [a.title, a.convo, a.keyword, a.faction].some((v) => v.toLowerCase().includes(q)));
  const pages = Math.max(1, Math.ceil(rows.length / ALERT_PAGE_SIZE));
  state.alertPage = Math.min(state.alertPage, pages);
  const from = (state.alertPage - 1) * ALERT_PAGE_SIZE, shown = rows.slice(from, from + ALERT_PAGE_SIZE);
  const menu = (a) => `<div class="row-menu">
      <button class="icon-btn icon-btn--sm" data-action="pop" data-arg="alert-${a.id}" data-key="pop-alert-${a.id}" data-pop aria-label="Actions for ${esc(a.title)}" aria-expanded="${state.pop === 'alert-' + a.id}">${icon('more', 'icon--sm')}</button>
      ${state.pop === 'alert-' + a.id ? `<div class="popover popover--menu" role="menu" aria-label="Alert actions">
        <a class="menu__item" role="menuitem" href="#/alerts/${a.id}">View details</a>
        <button class="menu__item" role="menuitem" data-action="alert-delete" data-arg="${a.id}" data-key="del-${a.id}">Delete alert</button></div>` : ''}
    </div>`;
  const page = (n) => `<button class="pagination__page" data-action="alert-page" data-arg="${n}" data-key="page-${n}" ${n === state.alertPage ? 'aria-current="page"' : ''} aria-label="Page ${n}">${n}</button>`;
  return `<div class="app__column app__column--wide">
    <div class="page-header"><div><h1 class="text-h1">Alerts</h1><p class="text-small">Get told when a conversation, keyword or faction picks up new mentions.</p></div>
      <div class="cluster"><div class="field search-field"><label class="visually-hidden" for="alert-q">Search alerts</label>
        <input class="input" id="alert-q" type="search" placeholder="Search alerts" data-input="alertQuery" data-key="alert-q" value="${esc(state.alertQuery)}"></div>
        <button class="btn btn--primary" data-action="alert-new" data-key="alert-new">${icon('plus', 'icon--sm')}Add alert</button></div></div>
    ${rows.length ? `<section class="card alerts-card" aria-label="Alerts">
      <table class="table">
        <thead><tr><th scope="col" class="table__title">Title</th><th scope="col">Conversation</th><th scope="col">Keyword</th><th scope="col">Faction</th><th scope="col">Created</th><th scope="col" class="table__actions"><span class="visually-hidden">Actions</span></th></tr></thead>
        <tbody>${shown.map((a) => `<tr>
          <td><a class="link" href="#/alerts/${a.id}" data-key="alert-${a.id}">${esc(a.title)}</a></td>
          <td>${esc(a.convo)}</td><td>${esc(a.keyword)}</td>
          <td>${a.faction ? esc(a.faction) : '<span class="text-caption">Any faction</span>'}</td>
          <td class="table__date">${fmtDate(a.created)}</td>
          <td class="table__actions">${menu(a)}</td></tr>`).join('')}</tbody>
      </table>
      <div class="alerts-footer">
        <span class="text-small" aria-live="polite">Showing ${from + 1} to ${from + shown.length} of ${rows.length} alerts</span>
        ${pages > 1 ? `<nav class="pagination" aria-label="Alert pages">
          <button class="icon-btn icon-btn--sm" data-action="alert-page" data-arg="${state.alertPage - 1}" data-key="page-prev" aria-label="Previous page" ${state.alertPage === 1 ? 'disabled' : ''}>${icon('chevron-left', 'icon--sm')}</button>
          ${Array.from({ length: pages }, (_, i) => page(i + 1)).join('')}
          <button class="icon-btn icon-btn--sm" data-action="alert-page" data-arg="${state.alertPage + 1}" data-key="page-next" aria-label="Next page" ${state.alertPage === pages ? 'disabled' : ''}>${icon('chevron-right', 'icon--sm')}</button></nav>` : ''}
      </div></section>`
    : q ? `<div class="empty-state"><span class="empty-state__icon">${icon('search', 'icon--lg')}</span><h2 class="text-h2">No alerts match “${esc(state.alertQuery)}”</h2><p class="text-small">Search looks at titles, conversations, keywords and factions.</p><button class="btn btn--secondary" data-action="alert-clear" data-key="alert-q">Clear search</button></div>`
    : `<div class="empty-state"><span class="empty-state__icon">${icon('bell', 'icon--lg')}</span><h2 class="text-h2">No alerts yet</h2><p class="text-small">Add an alert to hear when a conversation picks up new mentions.</p><button class="btn btn--primary" data-action="alert-new" data-key="alert-new-empty">${icon('plus', 'icon--sm')}Add alert</button></div>`}
  </div>`;
}

function viewAlert(id) {
  const a = allAlerts().find((x) => x.id === id);
  if (!a) return `<div class="app__column"><div class="page-header"><a class="back-link" href="#/alerts">${icon('chevron-left', 'icon--sm')}Alerts</a></div>
    <div class="empty-state"><span class="empty-state__icon">${icon('bell', 'icon--lg')}</span><h1 class="text-h2">This alert was deleted</h1><p class="text-small">It no longer collects mentions. Go back to see your other alerts.</p><a class="btn btn--secondary" href="#/alerts">Back to Alerts</a></div></div>`;
  const n = a.narrative && NARRATIVES[a.narrative];
  const t = a.thread || (n && { mentions: 1, date: a.created, root: { text: n.post, time: '9:00 AM', platform: 'Twitter' }, replies: [], originating: n.factions.slice(0, 1), amplifying: n.factions });
  const meta = (p, date) => `<ul class="thread__meta">${p.author ? `<li><strong>${esc(p.author)}</strong></li>` : ''}<li>${date ? fmtDate(date) + ' at ' : ''}${p.time}</li><li>${p.platform}</li></ul>`;
  const factions = (title, list) => `<div class="stack stack--tight"><h3 class="text-overline">${title}</h3><ul class="faction-list">${list.map((x) => `<li>${factionLink(x)}</li>`).join('')}</ul></div>`;
  const shownCount = t ? 1 + t.replies.length : 0;
  return `<div class="app__column app__column--wide">
    <div class="page-header"><div class="stack stack--tight"><a class="back-link" href="#/alerts">${icon('chevron-left', 'icon--sm')}Alerts</a>
      <h1 class="text-h1">${esc(a.title)}</h1></div>
      <button class="btn btn--secondary btn--sm" data-action="alert-delete" data-arg="${a.id}" data-key="detail-delete">${icon('trash', 'icon--sm')}Delete alert</button></div>
    <div class="alert-detail">
      ${t ? `<section class="card alert-detail__thread" aria-labelledby="thread-h">
        <div class="cluster cluster--between"><h2 class="text-h2" id="thread-h">Thread</h2>
          <span class="text-caption">${t.mentions} ${t.mentions === 1 ? 'mention' : 'mentions'} on ${fmtDate(t.date)}${shownCount < t.mentions ? ` · showing ${shownCount}` : ''}</span></div>
        <div class="thread">
          <article class="thread__post"><p class="text-overline">Original post</p><p class="text-body thread__text">${esc(t.root.text)}</p>${meta(t.root, t.date)}</article>
          ${t.replies.length ? `<ul class="thread__replies" aria-label="Replies">${t.replies.map((r) => `<li><article class="thread__post"><p class="text-body thread__text">${esc(r.text)}</p>${meta(r)}</article></li>`).join('')}</ul>` : ''}
        </div></section>`
      : `<div class="empty-state"><span class="empty-state__icon">${icon('bell', 'icon--lg')}</span><h2 class="text-h2">No mentions yet</h2><p class="text-small">Nothing has matched this alert since ${fmtDate(a.created)}. New mentions will appear here as they are found.</p></div>`}
      <aside class="alert-detail__aside">
        <section class="card stack" aria-labelledby="criteria-h"><h2 class="text-h3" id="criteria-h">Alert criteria</h2>
          <dl class="summary-list text-small"><dt>Conversation</dt><dd>${esc(a.convo)}</dd><dt>Keyword</dt><dd>${esc(a.keyword)}</dd><dt>Faction</dt><dd>${a.faction ? esc(a.faction) : 'Any faction'}</dd><dt>Created</dt><dd>${fmtDate(a.created)}</dd></dl>
          ${n ? `<p><button class="link text-small" data-action="open-narrative" data-arg="${a.narrative}" data-key="alert-narrative">Open the narrative analysis</button></p>` : ''}</section>
        ${t ? `<section class="card stack" aria-labelledby="factions-h"><h2 class="text-h3" id="factions-h">Participating factions</h2>
          ${factions('Originating', t.originating)}${factions('Amplifying', t.amplifying)}</section>` : ''}
      </aside>
    </div></div>`;
}

function alertForm() {
  const convos = [...new Set([...state.convos.filter((c) => c.name).map((c) => c.name), ...state.alertList.map((a) => a.convo)])];
  return `<div class="modal__header"><h2 class="text-h1">Add alert</h2><button class="icon-btn" data-action="modal-close" aria-label="Close">${icon('x')}</button></div>
    <div class="modal__body stack">
      <div class="field"><label class="field__label" for="al-title">Title</label><input class="input" id="al-title" autofocus placeholder="May 19 Day of Action" aria-describedby="al-title-hint"><span class="field__hint" id="al-title-hint">Shown in the Alerts list.</span></div>
      <div class="field"><label class="field__label" for="al-convo">Conversation</label><select class="select" id="al-convo">${convos.map((c) => `<option>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label class="field__label" for="al-keyword">Keyword</label><input class="input" id="al-keyword" placeholder="Day of action" aria-describedby="al-keyword-hint"><span class="field__hint" id="al-keyword-hint">Leave blank to hear about every new mention in the conversation.</span></div>

/* ---------- router + render ---------- */
const VIEWS = { digest: viewDigest, factions: (arg) => (arg ? viewFaction(arg) : viewFactions()), convos: (arg) => (arg ? viewConvo(arg) : viewConvos()), alerts: (arg) => (arg ? viewAlert(arg) : viewAlerts()) };
function route() { const [, name = 'digest', arg] = location.hash.split('/'); return { name, arg }; }

let lastPop = null;
function render(focusKey) {
  const r = route();
  $('#sidenav').innerHTML = NAV.map((n) => `<a class="sidenav__item" href="#/${n.route}" ${r.name === n.route ? 'aria-current="page"' : ''}>
    <span class="sidenav__icon">${n.letter ? `<strong aria-hidden="true">${n.letter}</strong>` : icon(n.icon)}</span>${n.label}</a>`).join('');
  const view = VIEWS[r.name];
  $('#main').innerHTML = view ? view(r.arg) : viewOutOfScope(NAV.find((n) => n.route === r.name)?.label || 'This page');
  renderPanel();
  if (state.pop && state.pop === lastPop) $$('.popover').forEach((p) => p.classList.add('is-static'));
  lastPop = state.pop;
  if (focusKey) $(`[data-key="${CSS.escape(focusKey)}"]`)?.focus();
}

/* ---------- toast ---------- */
function toast(message, undo) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon('check', 'icon--sm')}<span>${esc(message)}</span>${undo ? `<button class="link" data-undo>${undo.label}</button>` : ''}<button class="icon-btn icon-btn--sm" data-dismiss aria-label="Dismiss">${icon('x', 'icon--sm')}</button>`;
  el.querySelector('[data-dismiss]').onclick = () => el.remove();
  if (undo) el.querySelector('[data-undo]').onclick = () => { undo.run(); el.remove(); };
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 4500);
}

/* ---------- modal ---------- */
let modalReturn = null;
function openModal(html, { label, small } = {}) {
  modalReturn = document.activeElement;
  $('#modal-root').innerHTML = `<div class="scrim" data-action="modal-scrim"><div class="modal ${small ? 'modal--sm' : 'modal--full'}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div></div>`;
  ($('#modal-root [autofocus]') || $('#modal-root button'))?.focus();
}
function closeModal() {
  if (!$('#modal-root').firstChild) return;
  $('#modal-root').innerHTML = '';
  if (modalReturn?.dataset?.key) $(`[data-key="${CSS.escape(modalReturn.dataset.key)}"]`)?.focus();
  modalReturn = null;
}

/* ---------- actions ---------- */
const ACTIONS = {
  pop: (arg) => { state.pop = state.pop === arg ? null : arg; },
  filter: (arg) => { const [g, v] = arg.split(/:(.*)/); const s = state.filters[g]; s.has(v) ? s.delete(v) : s.add(v); },
  'filter-flagged': () => { state.filters.flagged = !state.filters.flagged; },
  'filter-clear': () => { const f = state.filters; f.impact.clear(); f.trajectory.clear(); f.faction.clear(); f.flagged = false; },
  sort: (arg) => { state.sort = arg; state.pop = null; return 'pop-sort'; },
  star: (arg) => { state.starred.has(arg) ? state.starred.delete(arg) : state.starred.add(arg); },
  collapse: (arg) => { state.collapsed.has(arg) ? state.collapsed.delete(arg) : state.collapsed.add(arg); },
  day: (arg) => { state.day = Math.max(0, Math.min(DAYS.length - 1, state.day + Number(arg))); state.pop = null; return state.day ? 'day-next' : 'day-prev'; },
  'curate-open': () => { state.curate = { open: true, step: 1 }; state.pop = null; return 'title-input'; },
  'curate-close': () => { state.curate.open = false; state.pop = null; return 'curate'; },
  'curate-step': (arg) => { state.curate.step = Number(arg); state.pop = null; return arg === '2' ? 'publish' : 'curate-next'; },
  move: (arg) => { const [id, d] = arg.split(':'); const i = state.order.indexOf(id), j = i + Number(d); [state.order[i], state.order[j]] = [state.order[j], state.order[i]]; },
  remove: (arg) => { state.order = state.order.filter((x) => x !== arg); state.removed.push(arg); return 'pop-add'; },
  restore: (arg) => { state.removed = state.removed.filter((x) => x !== arg); state.order.push(arg); state.pop = null; return 'pop-add'; },
  publish: () => { state.curate.open = false; toast('Digest published'); return 'curate'; },
  signout: () => { toast('Sign out is disabled in this prototype'); },
  feedback: () => {
    openModal(`<div class="modal__header"><h2 class="text-h1" id="fb-title">Submit feedback</h2><button class="icon-btn" data-action="modal-close" aria-label="Close">${icon('x')}</button></div>
      <div class="modal__body"><div class="field"><label class="field__label" for="fb-text">What should we know?</label>
        <textarea class="textarea" id="fb-text" autofocus rows="5" aria-describedby="fb-hint"></textarea>
        <span class="field__hint" id="fb-hint">Goes to the Yonder product team.</span></div></div>
      <div class="modal__footer"><button class="btn btn--secondary" data-action="modal-close">Cancel</button><button class="btn btn--primary" data-action="feedback-send">Send feedback</button></div>`, { label: 'Submit feedback', small: true });
    return false;
  },
  'feedback-send': () => {
    const t = $('#fb-text');
    if (!t.value.trim()) { t.setAttribute('aria-invalid', 'true'); $('#fb-hint').className = 'field__error'; $('#fb-hint').textContent = 'Write a few words before sending.'; t.focus(); return false; }
    closeModal(); toast('Feedback sent. Thank you.'); return false;
  },
  'modal-close': () => { closeModal(); return false; },
  'open-narrative': (arg) => {
    Object.assign(analysis, { id: arg, tab: 'who', noteOpen: false, idx: null }); analysis.hidden.clear();
    openModal('', { label: `Narrative analysis: ${NARRATIVES[arg].title}` }); renderAnalysis(); return false;
  },
  'an-tab': (arg) => { analysis.tab = arg; analysis.noteOpen = false; renderAnalysis(); return false; },
  'an-series': (arg, t) => { analysis.hidden.has(arg) ? analysis.hidden.delete(arg) : analysis.hidden.add(arg); renderAnalysis(t.dataset.key); return false; },
  'an-note-open': () => { analysis.noteOpen = true; renderAnalysis('note-text'); return false; },
  'an-note-cancel': () => { analysis.noteOpen = false; renderAnalysis('note-add'); return false; },
  'an-note-save': () => {
    const v = $('#note-text').value.trim();
    if (!v) { $('#note-text').setAttribute('aria-invalid', 'true'); $('#note-text').focus(); return false; }
    (state.notes[analysis.id] ||= []).push(v); analysis.noteOpen = false; renderAnalysis('note-add'); return false;
  },
  'an-note-delete': (arg) => { state.notes[analysis.id].splice(Number(arg), 1); renderAnalysis('note-add'); return false; },
  'an-alert': () => { const id = analysis.id; state.alerts.has(id) ? state.alerts.delete(id) : state.alerts.add(id); renderAnalysis('an-alert'); toast(state.alerts.has(id) ? 'Alert turned on' : 'Alert turned off'); return false; },
  'faction-clear': () => { state.factionQuery = ''; },
  'alert-clear': () => { state.alertQuery = ''; },
  'alert-page': (arg) => { state.alertPage = Number(arg); return 'page-' + arg; },
  'alert-new': () => { openModal(alertForm(), { label: 'Add alert', small: true }); return false; },
  'alert-save': () => {
    const title = $('#al-title');
    if (!title.value.trim()) { title.setAttribute('aria-invalid', 'true'); $('#al-title-hint').className = 'field__error'; $('#al-title-hint').textContent = 'Give this alert a title.'; title.focus(); return false; }
    state.alertList.unshift({ id: 'a' + Date.now(), title: title.value.trim(), convo: $('#al-convo').value, keyword: $('#al-keyword').value.trim() || 'Any new mention', faction: $('#al-faction').value, created: TODAY });
    state.alertQuery = ''; alertQueryShown = ''; state.alertPage = 1; closeModal(); render('alert-new'); toast('Alert added'); return false;
  },
  'alert-delete': (arg) => {
    const onDetail = route().arg === arg;
    if (arg.startsWith('n-')) { const nid = arg.slice(2); state.alerts.delete(nid); undoAlert = () => state.alerts.add(nid); }
    else { const i = state.alertList.findIndex((a) => a.id === arg), [row] = state.alertList.splice(i, 1); undoAlert = () => state.alertList.splice(i, 0, row); }
    state.pop = null;
    toast('Alert deleted', { label: 'Undo', run: () => { undoAlert(); render(); } });
    if (onDetail) { location.hash = '#/alerts'; return false; }
    return 'alert-new';
  },
  'proto-note': (arg) => { toast(arg); return false; },
  'convo-new': () => { const id = 'c' + (state.convos.length + 1); state.convos.push({ id, name: '', status: 'Draft', start: '', description: '', groups: [emptyGroup()] }); location.hash = `#/convos/${id}`; return false; },
  'tag-remove': (arg) => { const [path, i] = arg.split('|'); listAt(path).splice(Number(i), 1); markDirty(); return 'tf-' + path; },
  'cond-add': (arg) => { draft.groups[arg].any.push([]); markDirty(); return `tf-${arg}:any:${draft.groups[arg].any.length - 1}`; },
  'cond-remove': (arg) => { const [g, r] = arg.split(':'); draft.groups[g].any.splice(Number(r), 1); markDirty(); return 'ca-' + g; },
  'group-add': () => { draft.groups.push(emptyGroup()); markDirty(); return `tf-${draft.groups.length - 1}:any:0`; },
  'group-remove': (arg) => {
    undoGroup = { index: Number(arg), group: draft.groups.splice(Number(arg), 1)[0] }; markDirty();
    toast('Query group deleted', { label: 'Undo', run: () => { draft.groups.splice(undoGroup.index, 0, undoGroup.group); render('group-add'); } });
    return 'group-add';
  },
  'convo-save': () => {
    errors = {};
    if (!draft.name.trim()) errors.name = 'Give this conversation a name.';
    if (!draft.start) errors.start = 'Choose a start date.';
    else if (draft.start < MIN_START || draft.start > TODAY) errors.start = `Choose a date between ${fmtDate(MIN_START)} and ${fmtDate(TODAY)}.`;
    if (errors.name || errors.start) { render(errors.name ? 'cv-name' : 'cv-start'); return false; }
    saveState = 'saving'; render();
    setTimeout(() => { draft.status = 'Active'; Object.assign(state.convos.find((x) => x.id === draft.id), structuredClone(draft)); saveState = 'saved'; if (route().name === 'convos') render('convo-save'); toast('Conversation saved'); }, 900);
    return false;
  },
  'an-copy': () => { navigator.clipboard?.writeText(location.href).catch(() => {}); toast('Link copied'); return false; },
};

document.addEventListener('click', (e) => {
  const scrim = e.target.closest('[data-action="modal-scrim"]');
  if (scrim && e.target === scrim) return closeModal();
  const t = e.target.closest('[data-action]');
  if (state.pop && !e.target.closest('.popover, [data-pop]')) { state.pop = null; if (!t) return render(); }
  if (!t || t.disabled || t.dataset.action === 'modal-scrim') return;
  if (t.tagName === 'INPUT') return; // handled on change
  const key = t.dataset.key;
  const result = ACTIONS[t.dataset.action]?.(t.dataset.arg, t);
  if (result !== false) render(typeof result === 'string' ? result : key);
});
document.addEventListener('change', (e) => {
  const t = e.target.closest('input[data-action]');
  if (t) { ACTIONS[t.dataset.action](t.dataset.arg, t); render(t.dataset.key); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.input) {
    state[t.dataset.input] = t.value;
    const pos = t.selectionStart;
    render(t.dataset.key);
    $(`[data-key="${t.dataset.key}"]`)?.setSelectionRange(pos, pos);
  }
  if (t.dataset.field) { draft[t.dataset.field] = t.value; markDirty(); }
  if (t.dataset.tagField && t.value.endsWith(',')) commitTag(t);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.select) { const [g, k] = t.dataset.select.split(':'); draft.groups[g][k] = t.value; markDirty(); }
});
document.addEventListener('submit', (e) => e.preventDefault());
document.addEventListener('focusout', (e) => { if (e.target.dataset?.tagField && e.target.value.trim()) { const list = listAt(e.target.dataset.tagField), v = e.target.value.trim(); if (!list.includes(v)) list.push(v); e.target.value = ''; markDirty(); setTimeout(() => render(document.activeElement?.dataset?.key), 0); } });
document.addEventListener('click', (e) => { const w = e.target.closest('.tag-input'); if (w && !e.target.closest('button')) $('.tag-input__field', w).focus(); });
document.addEventListener('keydown', (e) => {
  if (e.target.dataset?.tagField) {
    if (e.key === 'Enter') { e.preventDefault(); commitTag(e.target); return; }
    if (e.key === 'Backspace' && !e.target.value) { const list = listAt(e.target.dataset.tagField); if (list.length) { list.pop(); markDirty(); render(e.target.dataset.key); } return; }
  }
  if (e.key === 'Escape') {
    if ($('#modal-root').firstChild) return closeModal();
    if (state.pop) { const k = 'pop-' + state.pop; state.pop = null; return render(k); }
    if (state.curate.open) { state.curate.open = false; return render('curate'); }
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute?.('role') === 'tab') {
    const i = TABS.findIndex(([k]) => k === analysis.tab);
    analysis.tab = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length][0];
    return renderAnalysis();
  }
  if (e.key === 'Tab' && $('#modal-root').firstChild) {
    const f = $$('#modal-root button:not(:disabled), #modal-root [href], #modal-root input, #modal-root textarea, #modal-root select, #modal-root [tabindex="0"]');
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
window.addEventListener('hashchange', () => { state.pop = null; state.curate.open = false; closeModal(); render(); window.scrollTo(0, 0); });
render();
</script>
<script>
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]'); if (!a) return;
  const href = a.getAttribute('href');
  if (href.startsWith('#')) { e.preventDefault(); location.hash = href; }
  else if (/^(index|design-system|case-study)\.html/.test(href)) e.preventDefault();
}, true);
</script>
